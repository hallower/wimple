// Use the plugins block for modern Gradle. It's cleaner and more efficient.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize' // Add this for @Parcelize functionality
}

android {
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.blogspot.charlie0301"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 46
        versionName "1.0.47"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Enable View Binding to replace Kotlin Synthetics
    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/notice.txt', 'META-INF/license.txt', 'META-INF/jersey-module-version', 'META-INF/ASL2.0', 'META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/services/javax.ws.rs.ext.MessageBodyReader', 'META-INF/services/javax.ws.rs.ext.MessageBodyWriter']
        }
    }
    productFlavors {
    }
    namespace 'kr.blogspot.charlie0301.wimple'
    lint {
        abortOnError false
        lintConfig file('lint.xml')
    }
    // No need to specify compileOptions for sourceCompatibility and targetCompatibility
    // with AGP 8.0+ as it defaults to 1.8. However, if you need a higher Java version,
    // you can set it here.
}

dependencies {
    implementation 'androidx.core:core:1.3.1'
    implementation 'androidx.appcompat:appcompat:1.0.2'
    // You have two versions of the preference library. It's best to use only the latest one.
    // implementation 'androidx.preference:preference:1.0.0' // This one is older
    implementation 'androidx.preference:preference:1.2.0' // Keeping the newer one

    implementation 'com.google.android.material:material:1.0.0'
    testImplementation 'junit:junit:4.12'
    implementation 'com.sun.jersey:jersey-client:1.19.3'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.0.1'

    // The kotlin_version variable is defined in the root build.gradle
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation 'androidx.biometric:biometric:1.0.1'
}

// The 'repositories' block is not needed here as it's already defined
// in the root build.gradle's 'allprojects' block, which applies to this module.
