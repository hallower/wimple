// Use the plugins block for modern Gradle. It's cleaner and more efficient.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize' // Add this for @Parcelize functionality
}

android {
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.blogspot.charlie0301"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 49
        versionName "1.0.49"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Enable View Binding to replace Kotlin Synthetics
    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/notice.txt', 'META-INF/license.txt', 'META-INF/jersey-module-version', 'META-INF/ASL2.0', 'META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/services/javax.ws.rs.ext.MessageBodyReader', 'META-INF/services/javax.ws.rs.ext.MessageBodyWriter']
        }
    }
    productFlavors {
    }
    namespace 'kr.blogspot.charlie0301.wimple'
    lint {
        abortOnError false
        lintConfig file('lint.xml')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'

    // Material Components 1.5+ ships Theme.Material3.* themes used by AppTheme
    // (values/styles.xml). Older 1.0.0 only had Theme.MaterialComponents.* and lacked
    // the M3 token system (?attr/colorOnSurface, surfaceVariant, etc.) that the
    // semantic colors in values/colors.xml + values-night/colors.xml resolve to.
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.12'
    implementation 'com.sun.jersey:jersey-client:1.19.3'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.0.1'

    // The kotlin_version variable is defined in the root build.gradle
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation 'androidx.biometric:biometric:1.1.0'
}

// The 'repositories' block is not needed here as it's already defined
// in the root build.gradle's 'allprojects' block, which applies to this module.
