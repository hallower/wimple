apply plugin: 'com.android.application'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 32
    defaultConfig {
        applicationId "com.blogspot.charlie0301"
        minSdkVersion 26
        targetSdkVersion 32
        versionCode 46
        versionName "1.0.46"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/notice.txt', 'META-INF/license.txt', 'META-INF/jersey-module-version', 'META-INF/ASL2.0', 'META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/services/javax.ws.rs.ext.MessageBodyReader', 'META-INF/services/javax.ws.rs.ext.MessageBodyWriter']
        }
    }
    productFlavors {
    }
    namespace 'kr.blogspot.charlie0301.wimple'
    lint {
        abortOnError false
        lintConfig file('lint.xml')
    }
}

dependencies {
    implementation 'androidx.core:core:1.3.1'
    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'androidx.preference:preference:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    testImplementation 'junit:junit:4.12'
    implementation 'com.sun.jersey:jersey-client:1.19.3'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.0.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.biometric:biometric:1.0.1'
    implementation 'androidx.preference:preference:1.2.0'
}
repositories {
    mavenCentral()
}
